# cn-broker-api 配置示例。
#
# 用法：复制到**仓库之外**（比如仓库的上一级），改成你机器的实际情况，然后
#   set CN_BROKER_API_CONFIG=D:\path\to\cn-broker-api.toml
# 缺省位置是仓库上一级的 `cn-broker-api.toml`——刚好在 git 视野之外。
#
# 🔴 别把改好的这份放回仓库：`.gitignore` 挡掉了 `*.toml`（只放行本示例），
#    但那是安全网，不是许可。
#
# 改完**重启服务**生效。没有热加载——重启一秒钟的事，而热加载是一整类 bug。

[server]
# 挨着客户端那个端口好记。只监听 127.0.0.1，且这一点不可配置：
# 这个端口能下单，让它监听外网不该是一个"选项"。
port = 17710

# 机器写的状态放这儿：日闩（今天提交过几次密码）、上次登录结果、健康检查缓存、token。
# 与本文件刻意分开——程序只写这里，永远不动你手写的配置和注释。
state_dir = "D:/cn-broker-api-state"


[health]
# `GET /v1/health` 返回缓存 + 年龄；只有 `POST /v1/health/refresh` 才真去探客户端。
# 🔴 便宜是硬要求：「交易账号登录了没」那一项要连客户端、查一次资产、占用账户串行槽，
#    几秒钟一次。诊断页每 5 秒刷一次的话，不缓存等于整天骚扰交易通道。
cache_seconds = 30

# 行情探针用哪只票。**要挑最活跃的**：冷门票在集合竞价刚开始时盘口可能全空，
# 那会把"客户端行情没问题"读成故障，而探针的假警报比不探更糟。
probe_symbol = "000001.SZ"


[driver]
# tdxquant ＝ 真的桌面客户端；paper ＝ 不连任何东西。
# 头一次跑、联调、CI 一律先用 paper 把接口走通，再换真驱动。
name = "paper"


[driver.tdxquant]
# 客户端安装根目录。**本服务里唯一写死机器路径的地方**——页面补丁、可执行文件都从这里推。
# 两处各写一份的话，换客户端时改一处、另一处静默指向不存在的目录，
# 而「文件不在」会被自检读成「补丁没打」这种假警报。
tdx_home = "D:/YourBroker/TdxClient"

# 客户端自己开的本地 JSON-RPC 端口。端口属主是客户端进程本身 ⇒ 没客户端就没服务端。
mcp_url = "http://127.0.0.1:17709"

# 交易密码从哪来：
#   file    ＝ 本服务自己读下面那个 cred_file
#   request ＝ 调用方在请求里带过来，本服务**只在内存留当天一份、绝不落盘**
# 搬迁期用 file（行为与搬迁前逐字节相同）；等调用方那侧把凭据管起来了再切 request。
cred_source = "file"

# `cred_source = "file"` 时的凭据文件，形如
#   {"account": "你的资金账号", "password": "交易密码", "account_type": "CREDIT"}
# 🔴 **必须放在仓库之外。**
cred_file = "D:/your-secrets/broker-login.json"

# 每个账户每天最多提交几次交易密码。
# ⚠️ 券商在密码连续输错之后会怎么做（锁多久、要不要人工解锁）**各家不同、本项目未核实**
#    ⇒ 不拿尝试次数去试。想调大先去券商确认策略，别按感觉调。
max_password_submits_per_day = 1
