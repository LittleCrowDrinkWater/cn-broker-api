# ============================================================================
#  cn-broker-api 配置模板 —— 这里列的是**全部**可配置项
# ============================================================================
#
#  用法
#    1. 把这个文件复制到**仓库之外**（默认位置是仓库的上一级 ../cn-broker-api.toml，
#       刚好在 git 视野之外），或者放任意位置然后指环境变量：
#         set CN_BROKER_API_CONFIG=D:\path\to\cn-broker-api.toml
#    2. 按你机器的实际情况改值
#    3. 重启服务生效。**没有热加载**——重启一秒钟的事，而热加载是一整类 bug
#
#  🔴 别把改好的那份放回仓库：.gitignore 挡掉了 *.toml（只放行本模板），
#     但那是安全网，不是许可。配置里装的是资金账号、客户端装在哪、凭据文件路径。
#
#  ⭐ 每一项都可以整段删掉——删了就吃默认值。服务启动时会把生效的全部配置打印一遍，
#     并在吃默认值的项前面标一个 ~，所以"我到底配上了没有"不用靠猜。
#
#  ⚠️ 缺文件不是错：全套默认值也起得来，只是 driver.tdxquant.tdx_home 没给的话，
#     驱动会在第一次真调用时明确失败（而不是 import 期就把服务拖挂）。
# ============================================================================


[server]

# 监听端口。默认 17710——挨着客户端自己那个 17709，好记。
# 只监听 127.0.0.1，且这一点**不可配置**：这个端口能下单，让它监听外网不该是一个"选项"。
port = 17710

# 机器写的状态放哪：日闩（今天提交过几次交易密码）、看门狗（今天拉起过几次进程）、
# 上次登录结果、健康检查缓存、token。
# 与本文件刻意分开——程序只写这里，永远不动你手写的配置和注释。
# 默认：本配置文件所在目录下的 cn-broker-api-state/
state_dir = "D:/Agent/cn-broker-api-state"

# token 文件。所有接口调用都要带 Authorization: Bearer <token>。
# 首次启动没有就自动生成一个并打印路径。
# 默认：state_dir/token.txt ⇒ 一般不需要写这一项。
# token_file = "D:/Agent/cn-broker-api-state/token.txt"


[health]

# GET /v1/health 的缓存秒数。
# 🔴 便宜是硬要求：「交易账号登录了没」那一项要连客户端、查一次资产，几秒钟且占用
#    账户串行槽。诊断页每 5 秒轮询一次的话，不缓存等于整天骚扰交易通道。
#    ⇒ GET 读缓存并回报年龄，POST /v1/health/refresh 才真去探。
# 默认 30。调小到个位数就失去缓存的意义了；调很大则页面上那个"数据于 N 秒前"会一直很大。
cache_seconds = 30

# 行情探针用哪只票。**要挑最活跃的**：冷门票在集合竞价刚开始时盘口可能全空，
# 那会把"客户端行情没问题"读成故障——而探针的假警报比不探更糟（人会学着无视整条自检）。
# 默认 000001.SZ（平安银行）。代码**必须带后缀**，裸 6 位码客户端那侧不认。
probe_symbol = "000001.SZ"


[driver]

# 选哪个驱动：
#   tdxquant ＝ 真的桌面客户端（会真起进程、真填密码、真发委托）
#   paper    ＝ 不连任何东西，四项检查恒绿且都标着"未真检查"
# 头一次跑、联调、CI 一律先用 paper 把接口走通，再换真驱动。
# 默认 tdxquant。
name = "tdxquant"


[driver.tdxquant]

# 客户端安装根目录。**本服务里唯一写死机器路径的地方**——页面补丁、可执行文件都从这里推。
# 两处各写一份的话，换客户端时改一处、另一处静默指向不存在的目录，
# 而「文件不在」会被自检读成「补丁没打」这种假警报。
#
# ⚠️ 要指向**同时装了行情/量化与交易两半**的那份安装目录（判据：目录下有 NewTc\TC.exe）。
#    只有主程序没有 NewTc 的那份凑不齐交易通道，指过去的表现是"能查却发不出委托"。
# 默认：无（不给的话驱动在第一次真调用时明确失败）。
tdx_home = "D:/Common/TDXV2026X64"

# 客户端自己开的本地 JSON-RPC 地址。端口属主是客户端主程序本身
# ⇒ **没客户端就没服务端**，这也是本服务不追求脱开客户端独立运行的原因。
# 默认 http://127.0.0.1:17709。
mcp_url = "http://127.0.0.1:17709"

# 交易密码从哪来：
#   file    ＝ 本服务自己读下面那个 cred_file
#   request ＝ 调用方在请求里带过来，本服务**只在内存留当天一份、绝不落盘**
# 搬迁期用 file（行为与搬迁前逐字节相同）；等调用方那侧把凭据管起来了再切 request。
# 默认 file。
cred_source = "file"

# cred_source = "file" 时的凭据文件，形如
#   {"account": "你的资金账号", "password": "交易密码", "account_type": "CREDIT"}
# account_type：STOCK ＝ 普通账户，CREDIT ＝ 信用（两融）账户。
# 🔴 **必须放在仓库之外。**
# 默认：无（cred_source = "file" 而这一项不给的话，登录那一趟会明确报"缺凭据"）。
cred_file = "D:/Agent/tdx-login.json"

# 每个账户每天最多提交几次交易密码。
# ⚠️ 券商在密码连续输错之后会怎么做（锁多久、要不要人工解锁）**各家不同、本项目未核实**
#    ⇒ 不拿尝试次数去试。想调大先去券商确认策略，别按感觉调。
# 计数落盘，所以重启服务不会把它清零（否则"重启三次 ＝ 无声无息地试了三次密码"）。
# 默认 1。
max_password_submits_per_day = 1


[watchdog]

# 看门狗：盯着客户端进程在不在，掉了就拉起来。
#
# 🔴 **默认关**。它会真起进程——默认开着等于让人在不知情的情况下多了一个会自己弹窗口的
#    常驻动作。想用就把这里改成 true。
#
# 它只做一件事（保证配方里那几个进程在跑），以及刻意不做的三件：
#   ① **绝不填密码**。交易登录那道门仍然只由 POST /v1/session/ensure 触发。
#      理由是硬的：密码额度每天一次，而看门狗每分钟醒一次——让它去登录，
#      第一次失败就把当天额度烧光，而且是在没人看着的时候烧的。
#   ② **绝不 kill**。只在"进程不存在"时拉起。进程还活着但没响应时杀掉重启，
#      会打断正在飞的委托——"没响应"和"没进程"是两件事。
#   ③ **一次只拉一个**。两个都缺时先拉主程序，下次醒来再看交易模块。同时拉的话，
#      客户端还在初始化就又弹一个窗口，而登录那侧第一步是"先分类是哪道门"。
#
# ⭐ 分工：计划任务保证**本服务**活着（install_task.ps1），看门狗保证**客户端**活着。
enabled = false

# 多久醒一次（秒）。枚举进程是零成本的只读动作，但拉起进程后客户端要几秒才到位，
# 太密的话会在同一次故障里连着拉好几次。最小 10。
# 默认 60。
interval_seconds = 60

# 工作时段（本地时间，闭区间）。半夜三点把客户端拉起来，除了在桌面上弹个窗口没有任何用。
# 默认 08:40 ~ 15:10：开盘前要给那条登录任务把进程准备好，收盘之后当天不再报单。
# 格式必须是 HH:MM，写歪了**当场报错不启动**（静默退回默认值的表现是
# "看门狗在我没让它工作的时段动手了"）。
window_start = "08:40"
window_end = "15:10"

# 只在周一到周五工作。
# ⚠️ **刻意不判节假日**：本服务不碰数据库、不该有交易日历这个依赖。
#    节假日多起一次客户端的代价是桌面上多一个窗口；引一份日历进来的代价是给这个
#    只该说 HTTP 的服务加一个它不该有的数据依赖。
weekdays_only = true

# 每个进程每天最多拉起几次。防的是"起来就自己退"的死循环——那种情况下无限重启只会刷屏，
# 而真正该做的是让人来看一眼。计数落盘，重启服务不清零。
# 默认 3。
max_starts_per_day = 3
